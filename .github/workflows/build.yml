name: Build

on:
  push:
    tags: ["v*"]
    branches: ["v2"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04   # older glibc = runs on more distros
            artifact: JModDownloader-Linux.tar.gz
          - os: windows-latest
            artifact: JModDownloader-Windows.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Qt runtime libs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libnss3 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libasound2

      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Tests
        run: python -m unittest tests.test_core -v

      - name: Build
        run: pyinstaller --noconfirm jmd.spec

      - name: Smoke test
        shell: bash
        env:
          JMD_SMOKE: "5000"
          JMD_DATA_DIR: ${{ runner.temp }}/jmd-smoke
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu --no-sandbox
        run: |
          dist/JModDownloader/JModDownloader || true
          cat "$JMD_DATA_DIR/smoke.txt"
          grep -q "SMOKE ok" "$JMD_DATA_DIR/smoke.txt"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -C dist -czf ${{ matrix.artifact }} JModDownloader

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/JModDownloader -DestinationPath ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} JopsepsMD
          generate_release_notes: true
          files: |
            JModDownloader-Linux.tar.gz
            JModDownloader-Windows.zip
